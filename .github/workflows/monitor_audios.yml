name: Monitor and Archive Deleted Group Audios

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-group-audios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run audio deletion monitor & archiver
        env:
          ROBLOX_GROUP_ID: "648972497"
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATE_FILE: "state/tracked_audios.json"
        run: python main.py

      - name: Commit updated audio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/tracked_audios.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update tracked group audio state [skip ci]"
            git push
          fi
